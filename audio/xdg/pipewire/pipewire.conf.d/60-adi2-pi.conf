# ADI-2-Pi's own PipeWire (adi2-pi-audio.service). The sample rate follows what plays;
# the ADI-2 can run at all of these over USB.
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 44100 48000 88200 96000 176400 192000 ]
    # headless: no X11 bell, no portal
    module.x11.bell = false
}
