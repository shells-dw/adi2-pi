# ADI-2-Pi's own WirePlumber, version 0.5 (Raspberry Pi OS Trixie).
# Uses only the ADI-2 (no other sound cards, so other software can keep them) and Bluetooth.
wireplumber.profiles = {
  main = {
    monitor.alsa-midi = disabled             # the bridge talks to the ADI-2's MIDI port itself
    monitor.v4l2 = disabled
    monitor.libcamera = disabled
    monitor.bluez = optional                 # (user sessions have it switched off)
    monitor.bluez.seat-monitoring = disabled # a system service has no seat
    monitor.bluez-midi = disabled
    support.reserve-device = disabled
  }
}

monitor.alsa.rules = [
  {
    matches = [ { device.name = "~alsa_card.*" } ]
    actions = { update-props = { device.disabled = true } }
  }
  {
    matches = [
      { api.alsa.card.name = "~ADI-2.*" }
      { alsa.card_name = "~ADI-2.*" }
      { device.product.name = "~ADI-2.*" }
    ]
    # the unit has its own volume: PipeWire never touches its mixer
    actions = { update-props = { device.disabled = false, api.alsa.soft-mixer = true } }
  }
  {
    matches = [ { node.name = "~alsa_.*" } ]
    actions = { update-props = { resample.quality = 10 } }
  }
]

monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source ]
  bluez5.enable-sbc-xq = true
  bluez5.hfphsp-backend = "none"
}

monitor.bluez.rules = [
  {
    matches = [ { device.name = "~bluez_card.*" } ]
    actions = { update-props = { bluez5.auto-connect = [ a2dp_sink a2dp_source ] } }
  }
  {
    matches = [ { node.name = "~bluez_.*" } ]
    actions = { update-props = { resample.quality = 10 } }
  }
]
