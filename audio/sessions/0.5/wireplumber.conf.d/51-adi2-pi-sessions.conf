# installed by adi2-pi: Bluetooth audio and the ADI-2 are handled by ADI-2-Pi's own audio
# service (adi2-pi-audio), so desktop/login sessions leave them alone. Removed by uninstall.sh.
wireplumber.profiles = {
  main = {
    monitor.bluez = disabled
  }
}
monitor.alsa.rules = [
  {
    matches = [
      { api.alsa.card.name = "~ADI-2.*" }
      { alsa.card_name = "~ADI-2.*" }
      { device.product.name = "~ADI-2.*" }
    ]
    actions = { update-props = { device.disabled = true } }
  }
]
